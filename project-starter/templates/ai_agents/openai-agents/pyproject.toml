[project]
name = "{{PROJECT_SLUG}}"
version = "0.1.0"
description = "{{PROJECT_DESCRIPTION}}"
authors = [{ name = "{{AUTHOR_NAME}}", email = "{{AUTHOR_EMAIL}}" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "google-generativeai>=0.3.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "asyncio>=3.4.3",
    "typing-extensions>=4.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
{{PROJECT_SLUG}} = "{{PROJECT_SLUG}}.main:run"
run_agent = "{{PROJECT_SLUG}}.main:run"
train = "{{PROJECT_SLUG}}.main:train"
replay = "{{PROJECT_SLUG}}.main:replay"
test = "{{PROJECT_SLUG}}.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
