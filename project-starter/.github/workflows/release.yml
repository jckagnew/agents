# =============================================================================
# RELEASE WORKFLOW
# =============================================================================
# This workflow creates releases and publishes packages
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  # =============================================================================
  # CREATE RELEASE
  # =============================================================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      tag_name: ${{ steps.create_release.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: changelog
        run: |
          # Extract changelog for this version
          if [ -f "CHANGELOG.md" ]; then
            # Extract changelog section for this version
            VERSION="${{ steps.get_version.outputs.VERSION }}"
            awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release_notes.md
          else
            echo "No changelog found" > release_notes.md
          fi

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          release_name: Release ${{ steps.get_version.outputs.VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, 'alpha') || contains(steps.get_version.outputs.VERSION, 'beta') || contains(steps.get_version.outputs.VERSION, 'rc') }}

  # =============================================================================
  # BUILD AND PUBLISH NPM PACKAGE
  # =============================================================================
  publish-npm:
    name: Publish NPM Package
    runs-on: ubuntu-latest
    needs: create-release
    if: contains(needs.create-release.outputs.tag_name, 'v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # =============================================================================
  # BUILD AND PUBLISH PYTHON PACKAGE
  # =============================================================================
  publish-python:
    name: Publish Python Package
    runs-on: ubuntu-latest
    needs: create-release
    if: contains(needs.create-release.outputs.tag_name, 'v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  # =============================================================================
  # BUILD AND PUSH DOCKER IMAGE
  # =============================================================================
  publish-docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/project-starter
          tags: |
            type=ref,event=tag
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # CREATE GITHUB RELEASE ASSETS
  # =============================================================================
  create-assets:
    name: Create Release Assets
    runs-on: ubuntu-latest
    needs: [create-release, publish-npm, publish-python, publish-docker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build application
        run: npm run build

      - name: Create source archive
        run: |
          git archive --format=tar.gz --prefix=project-starter-${{ needs.create-release.outputs.tag_name }}/ HEAD > project-starter-${{ needs.create-release.outputs.tag_name }}-source.tar.gz

      - name: Create binary distributions
        run: |
          # Create platform-specific builds
          mkdir -p dist
          tar -czf dist/project-starter-linux-x64.tar.gz -C dist .
          tar -czf dist/project-starter-macos-x64.tar.gz -C dist .
          zip -r dist/project-starter-windows-x64.zip dist/

      - name: Upload Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./project-starter-${{ needs.create-release.outputs.tag_name }}-source.tar.gz
          asset_name: project-starter-${{ needs.create-release.outputs.tag_name }}-source.tar.gz
          asset_content_type: application/gzip

  # =============================================================================
  # NOTIFY
  # =============================================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [create-release, publish-npm, publish-python, publish-docker, create-assets]
    if: always()
    steps:
      - name: Notify Success
        if: ${{ needs.create-release.result == 'success' && needs.publish-npm.result == 'success' && needs.publish-python.result == 'success' && needs.publish-docker.result == 'success' }}
        run: |
          echo "✅ Release ${{ needs.create-release.outputs.tag_name }} published successfully!"
          echo "📦 NPM package published"
          echo "🐍 Python package published"
          echo "🐳 Docker image published"
          echo "📁 Release assets created"

      - name: Notify Failure
        if: ${{ needs.create-release.result == 'failure' || needs.publish-npm.result == 'failure' || needs.publish-python.result == 'failure' || needs.publish-docker.result == 'failure' }}
        run: |
          echo "❌ Release failed!"
          echo "Create Release: ${{ needs.create-release.result }}"
          echo "Publish NPM: ${{ needs.publish-npm.result }}"
          echo "Publish Python: ${{ needs.publish-python.result }}"
          echo "Publish Docker: ${{ needs.publish-docker.result }}"
          exit 1
