      - name: Comment on PR with diffs (if failed)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⚠️ Visual Regression Detected

              Screenshots differ from baselines. Review the diff images to determine if changes are intentional.

              **Artifacts:**
              - Download diff images from the [workflow artifacts](#)

              **If changes are intentional:**
              1. Review diff images to confirm correctness
              2. Update baselines: \`mv screenshots/test-results/*.png screenshots/baseline/v2/\`
              3. Recompute baseline hash: \`node scripts/check-design-version.js --compute-baseline\`
              4. Update \`design_version.json\` with new hash
              5. Commit and push changes

              **If changes are unintentional:**
              1. Review the code changes that caused visual differences
              2. Fix the UI to match the baseline
              3. Re-run tests to verify fix
              `
            })

