name: Design Integration Check

# TODO: Wire this into required checks for merge protection
# This workflow validates design version artifacts before allowing QA or deployment

on:
  push:
    branches: [ main, weight-tracker-redesign ]
    paths:
      - 'software-factory/generated-apps/weight-tracker-nextjs/**'
      - 'docs/design/**'
      - 'scripts/check-design-version.js'
  pull_request:
    branches: [ main ]
    paths:
      - 'software-factory/generated-apps/weight-tracker-nextjs/**'
      - 'docs/design/**'
      - 'scripts/check-design-version.js'

jobs:
  validate-design-version:
    name: Validate Design Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Validate Design Version Manifest
        id: design-check
        run: |
          echo "::group::Design Version Validation"
          node scripts/check-design-version.js
          echo "::endgroup::"

      - name: Comment on PR (if failed)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⛔ Design Integration Check Failed

              The design version validation failed. This PR cannot be merged until design artifacts are valid.

              **Common Issues:**
              - \`design_version.json\` has placeholder values (\`<TBD>\`)
              - Design spec file missing or hash mismatch
              - Baseline screenshots missing or hash mismatch
              - Implementation status is \`pending_implementation\`

              **Fix:**
              1. Review the workflow logs above for specific errors
              2. Follow the [Design Integration Gate](../blob/main/docs/SOFTWARE_FACTORY_PLAYBOOK.md#-design-integration-gate) process
              3. Update design artifacts and push changes

              **Validation Script:**
              \`\`\`bash
              node scripts/check-design-version.js
              \`\`\`
              `
            })

  # TODO: Add visual regression testing job
  # This will run after validate-design-version passes
  visual-regression:
