name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  # Unit Tests Job
  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Upload unit test results
        uses: actions/upload-artifact@v3
        with:
          name: unit-test-results
          path: |
            coverage/
            reports/unit-test-results.json

  # Integration Tests Job
  integration-tests:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start test server
        run: |
          node tests/setup/test-server.js &
          sleep 5

      - name: Run integration tests
        run: npm run test:integration

      - name: Upload integration test results
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results
          path: reports/integration-test-results.json

  # E2E Tests Job
  e2e-tests:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E test results
        uses: actions/upload-artifact@v3
        with:
          name: e2e-test-results
          path: |
            test-results/
            reports/e2e-test-results.json

  # DevOps Scaffold Job
  devops-scaffold:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate DevOps scaffold
        run: npm run devops:scaffold

      - name: Build Docker images
        run: |
          docker build -t software-factory-app:latest .
          docker-compose build

      - name: Test Docker containers
        run: |
          docker-compose up -d
          sleep 30
          docker-compose ps
          docker-compose logs app

      - name: Upload DevOps artifacts
        uses: actions/upload-artifact@v3
        with:
          name: devops-scaffold
          path: |
            Dockerfile
            docker-compose.yml
            docker-compose.prod.yml
            .env.template

  # Security Scanning Job
  security-scan:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, devops-scaffold]
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Semgrep
        run: |
          curl -L https://github.com/returntocorp/semgrep/releases/latest/download/semgrep-v1.140.0-linux-x86_64.tar.gz | tar -xz
          sudo mv semgrep /usr/local/bin/

      - name: Install Bandit
        run: |
          pip install bandit

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Semgrep Scan
        run: |
          semgrep --config=config/security/.semgrep.yml --json --output=reports/semgrep-report.json .
        continue-on-error: true

      - name: Run Bandit Scan
        run: |
          bandit -r . -f json -o reports/bandit-report.json
        continue-on-error: true

      - name: Generate Security Summary
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          
          // Read reports
          const semgrepReport = fs.existsSync('reports/semgrep-report.json') 
            ? JSON.parse(fs.readFileSync('reports/semgrep-report.json', 'utf8'))
            : { results: [] };
          const banditReport = fs.existsSync('reports/bandit-report.json')
            ? JSON.parse(fs.readFileSync('reports/bandit-report.json', 'utf8'))
            : { results: [] };
          
          // Calculate metrics
          const semgrepErrors = semgrepReport.results.filter(r => r.level === 'ERROR').length;
          const semgrepWarnings = semgrepReport.results.filter(r => r.level === 'WARNING').length;
          const banditHigh = banditReport.results.filter(r => r.issue_severity === 'HIGH').length;
          const banditMedium = banditReport.results.filter(r => r.issue_severity === 'MEDIUM').length;
          
          // Calculate security score
          const criticalIssues = semgrepErrors + banditHigh;
          const highIssues = semgrepWarnings + banditMedium;
          const securityScore = Math.max(0, 100 - (criticalIssues * 10) - (highIssues * 5));
          
          const summary = {
            timestamp: new Date().toISOString(),
            semgrep: {
              findings: semgrepReport.results.length,
              errors: semgrepErrors,
              warnings: semgrepWarnings
            },
            bandit: {
              findings: banditReport.results.length,
              high: banditHigh,
              medium: banditMedium
            },
            security_score: securityScore,
            status: securityScore >= 80 ? 'PASS' : 'FAIL',
            critical_issues: criticalIssues,
            high_issues: highIssues
          };
          
          fs.writeFileSync('reports/security-summary.json', JSON.stringify(summary, null, 2));
          console.log('Security Summary:', JSON.stringify(summary, null, 2));
          "

      - name: Upload Security Reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: reports/

      - name: Security Check
        run: |
          if [ -f reports/security-summary.json ]; then
            SECURITY_SCORE=$(jq -r '.security_score' reports/security-summary.json)
            CRITICAL_ISSUES=$(jq -r '.critical_issues' reports/security-summary.json)
            
            echo "Security Score: $SECURITY_SCORE"
            echo "Critical Issues: $CRITICAL_ISSUES"
            
            if [ "$SECURITY_SCORE" -lt 80 ] || [ "$CRITICAL_ISSUES" -gt 0 ]; then
              echo "❌ Security scan failed - Score: $SECURITY_SCORE, Critical Issues: $CRITICAL_ISSUES"
              exit 1
            else
              echo "✅ Security scan passed - Score: $SECURITY_SCORE"
            fi
          else
            echo "❌ Security summary not found"
            exit 1
          fi

  visual-qa:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run Visual QA
        run: npm run test:visual

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: visual-qa-screenshots
          path: screenshots/

  deploy-preview:
    runs-on: ubuntu-latest
    needs: [lint-and-test, unit-tests, integration-tests, e2e-tests, devops-scaffold, security-scan, visual-qa]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Vercel (Preview)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_SCOPE }}

  deploy-production:
    runs-on: ubuntu-latest
    needs: [lint-and-test, unit-tests, integration-tests, e2e-tests, devops-scaffold, security-scan, visual-qa]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          scope: ${{ secrets.VERCEL_SCOPE }}

      - name: Notify on success
        if: success()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d '{"text":"✅ Software Factory deployed to production"}'

      - name: Notify on failure
        if: failure()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d '{"text":"❌ Software Factory deployment failed"}'
