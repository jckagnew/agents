name: 🔄 Update Market Research Configuration

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform (add-market, remove-market, update-competitors, add-keywords)'
        required: true
        type: choice
        options:
          - add-market
          - remove-market
          - update-competitors
          - add-keywords

permissions:
  contents: write
  issues: write

jobs:
  update-config:
    name: Update Market Research Config
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request == null && (contains(github.event.comment.body, '/add-market') || contains(github.event.comment.body, '/remove-market') || contains(github.event.comment.body, '/update-competitors') || contains(github.event.comment.body, '/add-keywords'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Parse and Update Config
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const configPath = path.join(process.cwd(), 'scripts', 'market_config.json');
            const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
            
            const comment = context.payload.comment.body;
            let updated = false;
            let response = '✅ Configuration updated:\n\n';
            
            // Parse commands
            if (comment.includes('/add-market')) {
              const match = comment.match(/\/add-market\s+"([^"]+)"\s+"([^"]+)"/);
              if (match) {
                const [, name, description] = match;
                const newMarket = {
                  id: name.toLowerCase().replace(/\s+/g, '-'),
                  name: name,
                  description: description,
                  keywords: [],
                  competitors: []
                };
                config.markets.push(newMarket);
                response += `➕ Added market: **${name}**\n`;
                updated = true;
              }
            }
            
            if (comment.includes('/remove-market')) {
              const match = comment.match(/\/remove-market\s+(\S+)/);
              if (match) {
                const marketId = match[1];
                config.markets = config.markets.filter(m => m.id !== marketId);
                response += `➖ Removed market: **${marketId}**\n`;
                updated = true;
              }
            }
            
            if (comment.includes('/update-competitors')) {
              const match = comment.match(/\/update-competitors\s+(\S+)\s+"([^"]+)"/);
              if (match) {
                const [, marketId, competitorsStr] = match;
                const competitors = competitorsStr.split(',').map(c => c.trim());
                const market = config.markets.find(m => m.id === marketId);
                if (market) {
                  market.competitors = competitors;
                  response += `🔄 Updated competitors for **${market.name}**: ${competitors.join(', ')}\n`;
                  updated = true;
                }
              }
            }
            
            if (comment.includes('/add-keywords')) {
              const match = comment.match(/\/add-keywords\s+(\S+)\s+"([^"]+)"/);
              if (match) {
                const [, marketId, keywordsStr] = match;
                const keywords = keywordsStr.split(',').map(k => k.trim());
                const market = config.markets.find(m => m.id === marketId);
                if (market) {
                  market.keywords.push(...keywords);
                  response += `🔑 Added keywords for **${market.name}**: ${keywords.join(', ')}\n`;
                  updated = true;
                }
              }
            }
            
            if (updated) {
              config.lastUpdated = new Date().toISOString();
              fs.writeFileSync(configPath, JSON.stringify(config, null, 2));
              
              // Commit the changes
              const { execSync } = require('child_process');
              execSync('git config user.name "github-actions[bot]"');
              execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');
              execSync('git add scripts/market_config.json');
              execSync(`git commit -m "Update market research configuration via issue comment"`);
              execSync('git push');
              
              // Comment on the issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: response + '\n\nConfiguration has been updated and will be used in the next daily report.'
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: '❌ Could not parse command. Please check the format:\n- `/add-market "Name" "Description"`\n- `/remove-market market-id`\n- `/update-competitors market-id "Competitor1, Competitor2"`\n- `/add-keywords market-id "keyword1, keyword2"`'
              });
            }

