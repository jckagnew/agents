name: 📈 Daily Business & Market Report

on:
  schedule:
    # Runs every day at 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows you to run it manually from the "Actions" tab

permissions:
  contents: read
  issues: write # To create an issue with the report

jobs:
  fetch-and-summarize:
    name: Run Market Research
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # This assumes your script uses node-fetch or similar
        # Add any other packages your script needs here
        run: npm install node-fetch@3

      - name: Run research script
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # This runs your script and saves its output
        run: node ./scripts/run_research.js > report.txt

      - name: Save report to database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e "
          const fs = require('fs');
          const reportContent = fs.readFileSync('report.txt', 'utf8');
          const configContent = fs.readFileSync('scripts/market_config.json', 'utf8');
          const config = JSON.parse(configContent);
          
          // Parse market insights from report (simplified - you may want to enhance this)
          const marketInsights = config.markets.map(market => ({
            market_id: market.id,
            market_name: market.name,
            sentiment_analysis: 'See full report',
            search_keywords: market.keywords,
            competitors_tracked: market.competitors
          }));
          
          fetch(process.env.SUPABASE_URL + '/functions/v1/save-market-research', {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + process.env.SUPABASE_SERVICE_ROLE_KEY,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              report: reportContent,
              marketConfig: config,
              marketInsights: marketInsights
            })
          }).then(r => r.json()).then(data => {
            console.log('Report saved:', data);
            if (!data.success) throw new Error(JSON.stringify(data));
          }).catch(err => {
            console.error('Error saving report:', err);
            process.exit(1);
          });
          "

      - name: Create GitHub Issue with Report
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reportContent = fs.readFileSync('report.txt', 'utf8');
            const date = new Date().toISOString().split('T')[0];
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📈 Daily Business & Market Report - ${date}`,
              body: reportContent + '\n\n---\n\n📊 **This report has been saved to the admin console database.**\n\nView it in the admin console under "Market Research Reports".',
              labels: ['market-research', 'automated']
            });

