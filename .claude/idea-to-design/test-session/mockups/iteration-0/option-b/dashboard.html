<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Water Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #F5F5F5;
            padding: 24px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 32px;
            color: #4285F4;
            margin-bottom: 24px;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .card .value {
            font-size: 36px;
            color: #4285F4;
            font-weight: 700;
        }

        .card .unit {
            font-size: 16px;
            color: #999;
        }

        .actions {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        button {
            background: #4285F4;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 24px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #3367D6;
        }

        button.secondary {
            background: #34A853;
        }

        button.secondary:hover {
            background: #2D9043;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 24px;
            }

            .metrics {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Today's Hydration</h1>

        <div class="metrics">
            <div class="card">
                <h3>Current Intake</h3>
                <div>
                    <span class="value">1.8</span>
                    <span class="unit">L</span>
                </div>
            </div>

            <div class="card">
                <h3>Daily Goal</h3>
                <div>
                    <span class="value">2.5</span>
                    <span class="unit">L</span>
                </div>
            </div>

            <div class="card">
                <h3>Progress</h3>
                <div>
                    <span class="value">72</span>
                    <span class="unit">%</span>
                </div>
            </div>
        </div>

        <div class="actions">
            <button>Log Water</button>
            <button class="secondary">View History</button>
        </div>
    </div>
</body>
</html>
