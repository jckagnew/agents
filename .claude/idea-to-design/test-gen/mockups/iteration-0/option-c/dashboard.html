<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - HydroTrack</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #F5F5F5;
            padding: 24px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 30px;
            color: #2196F3;
            margin-bottom: 24px;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .card {
            background: white;
            padding: 24px; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.2s, transform 0.2s;
        }

        .card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .card .value {
            font-size: 36px;
            color: #2196F3;
            font-weight: 700;
        }

        .card .unit {
            font-size: 16px;
            color: #999;
        }

        .actions {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 24px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #0070CD;
        }

        @media (max-width: 768px) {
            h1 { font-size: 24px; }
            .metrics { grid-template-columns: 1fr; }
            .actions { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dashboard</h1>
        <div class="metrics">
            
        <div class="card">
            <h3>Total</h3>
            <div>
                <span class="value">127</span>
                <span class="unit"></span>
            </div>
        </div>
    
        <div class="card">
            <h3>Active</h3>
            <div>
                <span class="value">89</span>
                <span class="unit"></span>
            </div>
        </div>
    
        <div class="card">
            <h3>Progress</h3>
            <div>
                <span class="value">70</span>
                <span class="unit">%</span>
            </div>
        </div>
    
        <div class="card">
            <h3>Score</h3>
            <div>
                <span class="value">8.5</span>
                <span class="unit">/10</span>
            </div>
        </div>
    
        </div>
        <div class="actions">
            <button>Primary Action</button>
            <button style="background: #34A853;">Secondary Action</button>
        </div>
    </div>
</body>
</html>
