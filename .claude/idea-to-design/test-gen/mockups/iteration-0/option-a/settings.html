<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - HydroTrack</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #F5F5F5;
            padding: 24px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-size: 32px;
            color: #2196F3;
            margin-bottom: 24px;
        }

        .section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .section h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #333;
        }

        .setting {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #E0E0E0;
        }

        .setting:last-child {
            border-bottom: none;
        }

        .setting label {
            font-size: 16px;
            color: #666;
        }

        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 24px;
            cursor: pointer;
            margin-top: 16px;
        }

        @media (max-width: 768px) {
            h1 { font-size: 24px; }
            .section { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Settings</h1>
        <div class="section">
            <h2>General</h2>
            <div class="setting">
                <label>Notifications</label>
                <input type="checkbox" checked>
            </div>
            <div class="setting">
                <label>Dark Mode</label>
                <input type="checkbox">
            </div>
        </div>
        <button>Save Changes</button>
    </div>
</body>
</html>
